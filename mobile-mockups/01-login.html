<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>MYHOTEL Mobile · Sign in (mockup)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,ital,wght@9..144,0,400;9..144,0,500;9..144,0,600;9..144,0,700;9..144,1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --fg:#F6F2E9; --muted:#C6CEDC; --subtle:#8A97AD;
    --border:rgba(222,228,238,.16); --border-strong:rgba(222,228,238,.30);
    --gold:#E9C266; --gold-2:#D6A23C; --gold-deep:#B07E1C;
    --ring:rgba(233,194,102,.45);
    --glass:rgba(10,20,38,.66); --glass-2:rgba(8,16,32,.78);
    --sunken:rgba(4,11,24,.6);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:var(--fg); background:#05070d; display:flex; align-items:center; justify-content:center;
    min-height:100vh; padding:24px; -webkit-font-smoothing:antialiased;
  }
  .display{font-family:"Fraunces",Georgia,serif;}

  .phone{
    position:relative; width:390px; max-width:100%; height:800px; max-height:94vh;
    border-radius:44px; overflow:hidden;
    box-shadow:0 40px 100px rgba(0,0,0,.65), 0 0 0 11px #0b1322, 0 0 0 13px #222e49, inset 0 0 0 1px rgba(255,255,255,.04);
  }

  /* layered cinematic backdrop */
  .bg{position:absolute; inset:0; z-index:0;
    background:#04101F url("https://images.unsplash.com/photo-1571896349842-33c89424de2d?q=80&w=1600&auto=format&fit=crop") center/cover no-repeat;
    animation:kb 28s ease-in-out infinite alternate; transform-origin:60% 40%;}
  @keyframes kb{from{transform:scale(1.05) translateY(0)}to{transform:scale(1.18) translateY(-2%)}}
  .bg::after{content:"";position:absolute;inset:0;
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(233,194,102,.18), transparent 45%),
      linear-gradient(180deg, rgba(4,10,22,.35) 0%, rgba(4,10,22,.72) 50%, #05101f 100%);}
  /* gold bokeh */
  .bokeh{position:absolute;inset:0;z-index:0;overflow:hidden;}
  .bokeh i{position:absolute;border-radius:50%;background:radial-gradient(circle,rgba(233,194,102,.55),transparent 70%);filter:blur(1px);opacity:.5;animation:float 9s ease-in-out infinite;}
  .bokeh i:nth-child(1){width:90px;height:90px;left:-20px;top:120px;animation-delay:0s;}
  .bokeh i:nth-child(2){width:50px;height:50px;right:30px;top:70px;opacity:.35;animation-delay:1.5s;}
  .bokeh i:nth-child(3){width:130px;height:130px;right:-40px;top:230px;opacity:.25;animation-delay:.8s;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}

  .screen{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:22px 24px 26px;}
  .statusbar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#fff;font-weight:600;letter-spacing:.02em;opacity:.9;}
  .statusbar .r{display:flex;gap:6px;align-items:center;font-size:11px;}

  /* brand */
  .brand{margin-top:30px;text-align:center;}
  .mark{width:66px;height:66px;border-radius:20px;margin:0 auto 16px;position:relative;
    background:linear-gradient(150deg,#1a2742,#0c1526);border:1px solid rgba(233,194,102,.5);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 14px 36px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.08);}
  .mark::after{content:"";position:absolute;inset:0;border-radius:20px;padding:1px;
    background:linear-gradient(150deg,rgba(233,194,102,.9),transparent 60%);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;}
  .mark span{font-family:"Fraunces";font-weight:600;font-size:30px;
    background:linear-gradient(135deg,#F4DfA6,var(--gold-2));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand h1{font-size:30px;margin:0;font-weight:600;letter-spacing:.06em;}
  .kicker{display:flex;align-items:center;justify-content:center;gap:9px;color:var(--gold);font-size:10.5px;letter-spacing:.32em;text-transform:uppercase;margin-top:9px;font-weight:600;}
  .kicker::before,.kicker::after{content:"";height:1px;width:26px;background:linear-gradient(90deg,transparent,var(--gold));opacity:.6;}
  .kicker::after{background:linear-gradient(90deg,var(--gold),transparent);}

  /* card */
  .card{margin-top:auto;position:relative;background:var(--glass);backdrop-filter:blur(22px) saturate(1.1);
    border:1px solid var(--border);border-radius:26px;padding:24px 22px 22px;
    box-shadow:0 30px 70px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);}
  .card::before{content:"";position:absolute;top:0;left:26px;right:26px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(233,194,102,.7),transparent);}
  .card h2{font-size:21px;margin:0 0 3px;font-weight:600;}
  .card .lead{color:var(--subtle);font-size:12.5px;margin:0 0 18px;}

  .seg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:var(--sunken);border:1px solid var(--border);border-radius:14px;padding:5px;margin-bottom:18px;}
  .seg button{height:46px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-family:inherit;font-size:12.5px;font-weight:600;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:.2s;}
  .seg button svg{width:17px;height:17px;}
  .seg button.on{background:linear-gradient(150deg,var(--gold),var(--gold-deep));color:#1a1205;box-shadow:0 8px 20px rgba(233,194,102,.34), inset 0 1px 0 rgba(255,255,255,.4);}

  label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--subtle);margin:0 0 7px;font-weight:600;}
  .field{margin-bottom:14px;}
  .input{display:flex;align-items:center;gap:11px;background:var(--sunken);border:1px solid var(--border);
    border-radius:14px;padding:0 15px;height:52px;transition:.2s;}
  .input:focus-within{border-color:var(--gold);box-shadow:0 0 0 3px var(--ring);background:rgba(4,11,24,.85);}
  .input svg{width:18px;height:18px;color:var(--gold);flex:none;opacity:.85;}
  .input input{flex:1;background:none;border:0;outline:none;color:var(--fg);font-size:15px;font-family:inherit;}
  .input input::placeholder{color:var(--subtle);}
  .eye{color:var(--subtle);cursor:pointer;display:flex;}

  .row{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px;font-size:12.5px;}
  .check{display:flex;align-items:center;gap:8px;color:var(--muted);}
  .check .box{width:18px;height:18px;border-radius:6px;border:1.5px solid var(--border-strong);background:var(--sunken);position:relative;}
  .check .box::after{content:"";position:absolute;inset:3px;border-radius:3px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));}
  .forgot{color:var(--gold);text-decoration:none;font-weight:600;}

  .btn{width:100%;height:54px;border:0;border-radius:15px;cursor:pointer;position:relative;overflow:hidden;
    background:linear-gradient(135deg,#F2D588,var(--gold-2) 55%,var(--gold-deep));color:#1a1205;
    font-weight:700;font-size:15.5px;font-family:inherit;letter-spacing:.02em;
    box-shadow:0 16px 36px rgba(233,194,102,.34), inset 0 1px 0 rgba(255,255,255,.5);
    display:flex;align-items:center;justify-content:center;gap:9px;}
  .btn::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-18deg);animation:sheen 4.5s ease-in-out infinite;}
  @keyframes sheen{0%,60%{left:-60%}80%{left:120%}100%{left:120%}}

  .hint{margin-top:15px;display:flex;gap:10px;align-items:flex-start;color:var(--subtle);font-size:11.5px;line-height:1.55;}
  .hint svg{width:15px;height:15px;color:var(--gold);flex:none;margin-top:1px;}
  .hint b{color:var(--muted);font-weight:600;}

  .foot{text-align:center;color:var(--subtle);font-size:10.5px;margin-top:16px;letter-spacing:.04em;}
  .foot b{color:var(--gold);font-weight:600;}
</style>
</head>
<body>
  <div class="phone">
    <div class="bg"></div>
    <div class="bokeh"><i></i><i></i><i></i></div>
    <div class="screen">
      <div class="statusbar">
        <span>9:41</span>
        <span class="r">5G&nbsp; <svg width="16" height="11" viewBox="0 0 24 24" fill="currentColor"><rect x="2" y="6" width="18" height="11" rx="2"/><rect x="21" y="9" width="2" height="5" rx="1"/></svg></span>
      </div>

      <div class="brand">
        <div class="mark"><span>M</span></div>
        <h1 class="display">MYHOTEL</h1>
        <div class="kicker">The Hyder Spark</div>
      </div>

      <div class="card">
        <h2 class="display">Welcome back</h2>
        <p class="lead">Sign in to your role</p>

        <div class="seg">
          <button type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3Z"/></svg>Admin
          </button>
          <button type="button" class="on">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>Manager
          </button>
          <button type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 12 0v1"/></svg>Staff
          </button>
        </div>

        <div class="field">
          <label>Email</label>
          <div class="input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            <input type="email" placeholder="you@hyderspark.com" value="riya@hotel.com" />
          </div>
        </div>

        <div class="field">
          <label>Password</label>
          <div class="input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            <input type="password" placeholder="••••••••" value="secret123" />
            <span class="eye"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></span>
          </div>
        </div>

        <div class="row">
          <span class="check"><span class="box"></span> Keep me signed in</span>
          <a class="forgot" href="#">Forgot?</a>
        </div>

        <button class="btn">
          Sign in
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" width="18" height="18"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>

        <div class="hint">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 4 5v6c0 5 3.5 9 8 11 4.5-2 8-6 8-11V5l-8-3Z"/></svg>
          <span>You'll only see the screens your <b>role</b> allows — Reception lands on Front Desk; Housekeeping sees room tasks.</span>
        </div>
      </div>

      <div class="foot">Secured by <b>MYHOTEL PMS</b> · v1.0</div>
    </div>
  </div>
</body>
</html>
